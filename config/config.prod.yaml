server:
  name: "miaosha-server"
  port: 8080
  mode: "release"
  instance_id: ""
  read_timeout: 5
  write_timeout: 5
  idle_timeout: 60
  max_body_bytes: 1048576
  sign_secret: "${MIAOSHA_SERVER_SIGN_SECRET}"
  performance_mode: true

jwt:
  secret: "${MIAOSHA_JWT_SECRET}"
  expire_hours: 24
  issuer: "miaosha-system"

mysql:
  master:
    host: "${MIAOSHA_MYSQL_HOST}"
    port: 3306
    user: "${MIAOSHA_MYSQL_USER}"
    password: "${MIAOSHA_MYSQL_PASSWORD}"
    database: "miaosha"
    charset: "utf8mb4"
    max_idle_conns: 50
    max_open_conns: 200
    conn_max_lifetime: 3600
  order_table_shard_count: 16

redis:
  addrs:
    - "${MIAOSHA_REDIS_HOST}:6379"
  password: "${MIAOSHA_REDIS_PASSWORD}"
  pool_size: 200
  min_idle_conns: 50
  dial_timeout: 5
  read_timeout: 3
  write_timeout: 3

rabbitmq:
  urls:
    - "amqp://${MIAOSHA_MQ_USER}:${MIAOSHA_MQ_PASSWORD}@rabbitmq:5672/miaosha"
  vhost: "/miaosha"
  exchange:
    order: "miaosha.order.exchange"
    dead_letter: "miaosha.dead.letter.exchange"
  queue:
    order: "miaosha.order.queue"
    delay: "miaosha.delay.queue"
    dead_letter: "miaosha.dead.letter.queue"
  consumer:
    concurrency: 20
    prefetch: 100
  delay_ttl_ms: 1800000

kafka:
  brokers:
    - "kafka:9092"
  topic: "miaosha-behavior-track"
  producer:
    acks: "all"
    compression: "snappy"
    max_message_bytes: 1048576
    batch_size: 100
    linger_ms: 10

etcd:
  endpoints:
    - "etcd:2379"
  dial_timeout: 5
  lease_ttl: 10
  service_prefix: "/miaosha/services/"

sentinel:
  enabled: true
  dashboard: "http://127.0.0.1:8080"
  app_name: "miaosha-server"
  log_dir: "./logs/sentinel"
  global_qps: 10000
  user_qps: 10
  seckill_qps: 5000
  circuit_breaker:
    max_rt_ms: 1000
    max_rt_ratio: 0.5
    min_request_amount: 10
    stat_interval_ms: 1000
    recovery_timeout_ms: 3000
  hot_param:
    threshold: 100
    duration_sec: 1

log:
  level: "info"
  format: "json"
  # [修复] 改为 both：同时输出到控制台和文件，docker logs 能看到真实启动错误，避免排障盲区
  output: "both"
  file_path: "/app/logs/miaosha.log"
  max_size: 500
  max_backups: 30
  max_age: 30
  compress: true

dingtalk:
  enabled: false
  webhook_url: ""
  secret: ""
  alert:
    error_rate_threshold: 0.05
    qps_threshold: 8000
    mq_backlog_threshold: 1000
    circuit_breaker_trigger: true

reconciler:
  enabled: true
  interval_sec: 300
  batch_size: 100

prometheus:
  enabled: true
  metrics_path: "/metrics"
  metrics_port: 9090
