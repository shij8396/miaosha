# Docker 部署专用配置，所有地址使用 Docker 服务名
# [修复] 密钥脱敏：敏感信息通过环境变量 MIAOSHA_ 前缀注入，docker-compose.yml environment 段提供实际值
# 以下敏感字段值为占位符，运行时由环境变量覆盖。若未设置环境变量，系统将因连接失败而报错

server:
  name: "miaosha-server"
  port: 8080
  mode: "release"
  instance_id: ""
  read_timeout: 5
  write_timeout: 5
  idle_timeout: 60
  max_body_bytes: 1048576
  sign_secret: "miaosha-sign-secret-2026"  # 由 MIAOSHA_SERVER_SIGN_SECRET 注入
  performance_mode: true

jwt:
  secret: "miaosha-jwt-secret-key-2026-enterprise-production"  # 由 MIAOSHA_JWT_SECRET 注入
  expire_hours: 24
  issuer: "miaosha-system"

mysql:
  # [修复] 容器内使用 Docker 服务名，而非 127.0.0.1
  master:
    host: "mysql-master"
    port: 3306
    user: "root"
    password: "miaosha_master_2026"  # 由 MIAOSHA_MYSQL_MASTER_PASSWORD 注入
    database: "miaosha"
    charset: "utf8mb4"
    max_idle_conns: 20
    max_open_conns: 200
    conn_max_lifetime: 3600
  slaves:
    - host: "mysql-slave"
      port: 3306
      user: "root"
      password: "miaosha_slave_2026"  # 由 MIAOSHA_MYSQL_SLAVES_0_PASSWORD 注入
      database: "miaosha"
      charset: "utf8mb4"
      max_idle_conns: 20
      max_open_conns: 200
      conn_max_lifetime: 3600
  order_table_shard_count: 16

redis:
  # [修复] 容器内使用 Docker 服务名 redis-node1
  addrs:
    - "redis-node1:6379"
  password: "miaosha_redis_2026"  # 由 MIAOSHA_REDIS_PASSWORD 注入
  pool_size: 100
  min_idle_conns: 20
  dial_timeout: 5
  read_timeout: 3
  write_timeout: 3

rabbitmq:
  # [修复] 容器内使用 Docker 服务名 rabbitmq，vhost 为 /miaosha
  urls:
    - "amqp://admin:miaosha_mq_2026@rabbitmq:5672/miaosha"  # 由 MIAOSHA_RABBITMQ_URLS_0 注入
  vhost: "/miaosha"
  exchange:
    order: "miaosha.order.exchange"
    dead_letter: "miaosha.dead.letter.exchange"
  queue:
    order: "miaosha.order.queue"
    delay: "miaosha.delay.queue"
    dead_letter: "miaosha.dead.letter.queue"
  consumer:
    concurrency: 10
    prefetch: 50
  delay_ttl_ms: 1800000

kafka:
  # [修复] 容器内使用 Docker 服务名 kafka
  brokers:
    - "kafka:9092"
  topic: "miaosha-behavior-track"
  producer:
    acks: "all"
    compression: "snappy"
    max_message_bytes: 1048576
    batch_size: 100
    linger_ms: 10

etcd:
  # [修复] 容器内使用 Docker 服务名 etcd，仅保留客户端端口 2379
  endpoints:
    - "etcd:2379"
  dial_timeout: 5
  lease_ttl: 10
  service_prefix: "/miaosha/services/"

sentinel:
  # [修复] 生产环境必须开启 Sentinel 流量防护
  enabled: true
  dashboard: "127.0.0.1:8080"
  app_name: "miaosha-server"
  log_dir: "./logs/sentinel"
  global_qps: 10000
  user_qps: 10
  seckill_qps: 5000
  circuit_breaker:
    max_rt_ms: 1000
    max_rt_ratio: 0.5
    min_request_amount: 10
    stat_interval_ms: 1000
    recovery_timeout_ms: 3000
  hot_param:
    threshold: 100
    duration_sec: 1

log:
  level: "info"
  format: "json"
  output: "stdout"
  file_path: "./logs/miaosha.log"
  max_size: 100
  max_backups: 30
  max_age: 7
  compress: true

dingtalk:
  enabled: true
  # [修复] 钉钉 webhook 和 secret 建议从环境变量读取
  # 可通过环境变量 MIAOSHA_DINGTALK_WEBHOOK_URL 和 MIAOSHA_DINGTALK_SECRET 覆盖
  webhook_url: "https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN"
  secret: "YOUR_SECRET"
  alert:
    error_rate_threshold: 0.05
    qps_threshold: 8000
    mq_backlog_threshold: 1000
    circuit_breaker_trigger: true

reconciler:
  enabled: true
  interval_sec: 300
  batch_size: 100

prometheus:
  enabled: true
  metrics_path: "/metrics"
  metrics_port: 9090