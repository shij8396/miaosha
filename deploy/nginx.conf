# [修复] Nginx 反向代理配置：修复 upstream 为 Docker 服务名、添加前端静态文件、安全响应头、gzip 优化
worker_processes auto;
events { worker_connections 65535; use epoll; }
http {
    include mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_trace_id" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    sendfile on; tcp_nopush on; tcp_nodelay on; keepalive_timeout 65; client_max_body_size 10m;
    # [修复] 扩展 gzip_types，添加 JS/CSS/HTML/SVG 等前端资源类型
    gzip on; gzip_min_length 1k; gzip_types text/plain application/json application/javascript text/css image/svg+xml application/xml text/xml;
    limit_req_zone $binary_remote_addr zone=seckill:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # [修复] 多实例负载均衡：Docker Compose --scale 自动 DNS 轮询，least_conn 分配请求到最空闲实例
    # 启动多实例：docker compose up --scale miaosha-server=3 -d
    # Nginx 会通过 Docker DNS 解析 miaosha-server 到所有实例 IP，least_conn 自动负载均衡
    upstream miaosha_cluster {
        least_conn;
        server miaosha-server:8080 max_fails=3 fail_timeout=30s;
        keepalive 100;
    }

    server {
        # [修复] server_name 改为 _，匹配所有请求（不依赖域名）
        listen 80; server_name _;

        # [修复] 添加安全响应头，防止点击劫持、MIME 嗅探和 XSS 攻击
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # [修复] 添加前端静态文件 location，支持 SPA 路由
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location /health { proxy_pass http://miaosha_cluster; proxy_http_version 1.1; proxy_set_header Connection ""; }
        location /metrics { proxy_pass http://miaosha_cluster; proxy_http_version 1.1; proxy_set_header Connection ""; }
        location /api/v1/seckill {
            limit_req zone=seckill burst=200 nodelay; limit_conn conn_limit 10;
            proxy_pass http://miaosha_cluster; proxy_http_version 1.1; proxy_set_header Connection "";
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Trace-ID $http_x_trace_id; proxy_read_timeout 30s; proxy_send_timeout 30s;
        }
        location /api/ {
            proxy_pass http://miaosha_cluster; proxy_http_version 1.1; proxy_set_header Connection "";
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Trace-ID $http_x_trace_id; proxy_read_timeout 30s; proxy_send_timeout 30s;
        }
    }
}